<section class="sl-cloud">
  <div class="sl-cloud-controls" role="group" aria-label="Point cloud display mode">
    <button data-mode="compare" aria-pressed="true">Side by side</button>
    <button data-mode="overlay" aria-pressed="false">Overlay</button>
    <button data-mode="control" aria-pressed="false">Zero-input control</button>
    <button data-reset>Reset view</button>
  </div>
  <p data-cloud-caption></p>
  <canvas data-cloud-canvas aria-label="Interactive 3D Wi-Fi prediction and measured reference point clouds"></canvas>
  <p class="sl-cloud-help">Drag to orbit · Scroll to zoom · Coordinates are standardized, not meters. Cyan: prediction · Amber: measured LiDAR · Purple: zero-input control.</p>
</section>
